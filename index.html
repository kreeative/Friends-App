<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      Rewritten by the inline script below, before first paint, to the ground
      the chosen theme actually paints. The value here is only what a crawler
      or a browser with JavaScript off sees, so it is sun's, the default.

      It was #FFFFFF while the manifest said #DE3578: three values, two of them
      colours the app paints nowhere. See GROUND in src/lib/theme.jsx.
    -->
    <meta name="theme-color" content="#FFF5F7" />
    <meta name="description" content="A daily check-in with a few people who know what you are working on. One minute an evening, two to six people, sixty seconds. Ambition is contagious." />
    <link rel="canonical" href="https://richandfriends.xyz/" />

    <!--
      Open Graph and Twitter. These are what a link to the site looks like
      when it is pasted into a message, which for a product spread by word of
      mouth is a more common first impression than a search result.

      Absolute URLs, because a crawler resolving a relative path against its
      own host gets nothing. The image is the wordmark on its own ground: it
      has to be legible as a 200px thumbnail, which rules out a screenshot.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rich &amp; Friends" />
    <meta property="og:title" content="Rich &amp; Friends" />
    <meta property="og:description" content="One check-in a day, at the same time, with the same people. Sixty seconds. That is the whole thing." />
    <meta property="og:url" content="https://richandfriends.xyz/" />
    <meta property="og:image" content="https://richandfriends.xyz/brand/wordmark-pink.png" />
    <meta property="og:image:alt" content="Rich &amp; Friends" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:locale:alternate" content="fr_CA" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rich &amp; Friends" />
    <meta name="twitter:description" content="One check-in a day, at the same time, with the same people. Sixty seconds." />
    <meta name="twitter:image" content="https://richandfriends.xyz/brand/wordmark-pink.png" />

    <!--
      Organisation data for the knowledge panel. Kept to what is verifiable:
      a name, a URL and a logo. Inventing ratings or founding dates here is
      how a site earns a structured-data penalty rather than a rich result.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Rich & Friends",
        "url": "https://richandfriends.xyz",
        "logo": "https://richandfriends.xyz/brand/wordmark-pink.png",
        "description": "A daily group check-in for two to six people."
      }
    </script>
    <!--
      Stamps the saved theme before the first paint. Without it the page
      renders the default, then corrects itself once React mounts, which is
      visible as a flash of the wrong colours on every load. Keep the storage
      keys and the fallbacks identical to src/lib/theme.jsx.
    -->
    <script>
      ;(function () {
        /* One attribute now. The dark mode is gone, so there is no ground to
           resolve and nothing to flash, only which of the two colour themes
           to stamp before first paint. */
        var d = document.documentElement
        var theme = 'sun'
        try {
          theme = localStorage.getItem('rf.theme')
          if (!theme) {
            /* Migrate the older schemes: blue was the only cool one. */
            var old = localStorage.getItem('rf.accent')
            theme = old === 'blue' ? 'sea' : 'sun'
          }
          if (['sun', 'sea'].indexOf(theme) < 0) theme = 'sun'
        } catch (e) {
          /* Private modes can throw on read; the default above stands. */
        }
        d.setAttribute('data-theme', theme)

        /* And the browser chrome, so an installed app does not open with a
           white bar above a blush page. Same two values as GROUND in
           src/lib/theme.jsx and --c-bg in src/index.css; it has to be a
           literal because a meta tag cannot hold a custom property. */
        var ground = { sun: '#FFF5F7', sea: '#F0F9FF' }
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', ground[theme] || ground.sun)
      })()
    </script>
    <!--
      Four declarations, because the tab and the home screen want different
      things and only one of them was being answered.

      /favicon.ico comes first. There was only a 192px PNG here, and a great
      many browsers still request /favicon.ico by path before they look at any
      link tag at all. That 404'd, so the tab fell back to a blank sheet. The
      .ico carries 16 through 64 in one file.

      The small sizes use a tighter crop of the same artwork. The wordmark is
      four lines of lettering inside a generous margin: at 512 that margin is
      the design, at 16 it is most of the icon and the words are a smudge.
      Trimming the ground gives the lettering the whole square.
    -->
    <!--
      ?v=2 on every one of these, and that is the whole reason this changed.

      The artwork was already the full wordmark; the files were correct. But a
      favicon is the most aggressively cached asset a browser has. Safari in
      particular keeps one keyed by origin, not by content hash, and will keep
      showing a stale icon across hard reloads and even app restarts. A new
      path is the only thing it reliably notices, so the version string is
      doing real work rather than being decoration.

      Bump it again if the artwork ever changes.
    -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=2" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/manifest.webmanifest?v=2" />
    <!--
      No font link. Nunito is self-hosted and declared in src/index.css, so
      there is no third-party connection on the critical path and nothing to
      fall back from when a network blocks Google Fonts.
    -->
    <title>Rich &amp; Friends</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
